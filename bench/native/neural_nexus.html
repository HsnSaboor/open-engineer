<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Nexus | Generative Physics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Inter', system-ui, sans-serif;
        }
        canvas {
            display: block;
        }
        .glass {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input[type="range"] {
            accent-color: #6366f1;
        }
        /* Hide scrollbar for UI but allow interaction */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="nexusCanvas"></canvas>

    <!-- UI Overlay -->
    <div class="absolute top-0 left-0 w-full p-4 md:p-8 pointer-events-none flex flex-col md:flex-row justify-between items-start gap-4">
        <div class="pointer-events-auto glass p-6 rounded-2xl w-full max-w-xs transition-all duration-300 hover:shadow-2xl hover:shadow-indigo-500/10">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400 mb-1">Neural Nexus</h1>
            <p class="text-xs text-slate-400 mb-6 uppercase tracking-widest">Generative Physics Visualizer</p>
            
            <div class="space-y-6">
                <!-- Particle Count -->
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <label class="text-slate-300">Particles</label>
                        <span id="countVal" class="text-indigo-400 font-mono">1000</span>
                    </div>
                    <input type="range" id="particleCount" min="100" max="2000" step="50" value="1000" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Gravity Strength -->
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <label class="text-slate-300">Gravity</label>
                        <span id="gravityVal" class="text-indigo-400 font-mono">0.5</span>
                    </div>
                    <input type="range" id="gravity" min="0" max="2" step="0.1" value="0.5" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Friction -->
                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <label class="text-slate-300">Friction</label>
                        <span id="frictionVal" class="text-indigo-400 font-mono">0.02</span>
                    </div>
                    <input type="range" id="friction" min="0" max="0.1" step="0.005" value="0.02" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Color Scheme -->
                <div class="space-y-2">
                    <label class="text-sm text-slate-300">Color Palette</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setTheme('neon')" class="px-2 py-1.5 text-[10px] uppercase font-bold rounded border border-indigo-500/30 hover:bg-indigo-500/20 transition-colors">Neon</button>
                        <button onclick="setTheme('ember')" class="px-2 py-1.5 text-[10px] uppercase font-bold rounded border border-orange-500/30 hover:bg-orange-500/20 transition-colors">Ember</button>
                        <button onclick="setTheme('mono')" class="px-2 py-1.5 text-[10px] uppercase font-bold rounded border border-slate-500/30 hover:bg-slate-500/20 transition-colors">Mono</button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="pt-4 flex gap-2">
                    <button id="snapshotBtn" class="flex-1 bg-white/10 hover:bg-white/20 text-white py-2 rounded-xl text-sm font-medium transition-all backdrop-blur-md border border-white/10">
                        Capture
                    </button>
                    <button id="resetBtn" class="px-4 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-sm font-medium transition-all shadow-lg shadow-indigo-600/20">
                        Reset
                    </button>
                </div>
            </div>
        </div>

        <div class="pointer-events-auto glass px-4 py-2 rounded-full text-[10px] text-slate-400 flex items-center gap-3">
            <span class="flex items-center gap-1"><kbd class="bg-white/10 px-1 rounded">Click</kbd> Flocking</span>
            <span class="flex items-center gap-1"><kbd class="bg-white/10 px-1 rounded">Dbl-Click</kbd> Disperse</span>
            <span id="fpsCounter" class="text-emerald-400 font-mono border-l border-white/10 pl-3">60 FPS</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('nexusCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const fpsCounter = document.getElementById('fpsCounter');
        
        // Configuration
        let config = {
            count: 1000,
            gravity: 0.5,
            friction: 0.02,
            theme: 'neon',
            constellationDist: 80,
            repulsionRadius: 50,
            mouseForce: 0.05
        };

        const themes = {
            neon: { bg: '#050505', particle: '#4f46e5', line: 'rgba(99, 102, 241, 0.15)', accents: ['#818cf8', '#22d3ee', '#c084fc'] },
            ember: { bg: '#0a0500', particle: '#f97316', line: 'rgba(249, 115, 22, 0.15)', accents: ['#f87171', '#fbbf24', '#ea580c'] },
            mono: { bg: '#000000', particle: '#ffffff', line: 'rgba(255, 255, 255, 0.1)', accents: ['#f8fafc', '#94a3b8', '#334155'] }
        };

        let particles = [];
        let width, height;
        let mouse = { x: -1000, y: -1000, down: false, dispersing: false };
        let grid = [];
        let gridSize = 100;

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = 1.2 + Math.random() * 2;
                this.color = themes[config.theme].accents[Math.floor(Math.random() * themes[config.theme].accents.length)];
            }

            update() {
                // Apply Friction
                this.vx *= (1 - config.friction);
                this.vy *= (1 - config.friction);

                // Mouse Interaction
                if (mouse.x > 0) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (mouse.down) {
                        // Flocking
                        this.vx += (dx / dist) * config.mouseForce * 2;
                        this.vy += (dy / dist) * config.mouseForce * 2;
                    } else if (mouse.dispersing) {
                        // Disperse
                        if (dist < 200) {
                            this.vx -= (dx / dist) * config.mouseForce * 15;
                            this.vy -= (dy / dist) * config.mouseForce * 15;
                        }
                    }
                }

                // Internal Gravity (towards center roughly or noise)
                this.vx += (Math.random() - 0.5) * 0.05;
                this.vy += (Math.random() - 0.5) * 0.05;

                this.x += this.vx;
                this.y += this.vy;

                // Boundary Damping
                if (this.x < 0) { this.x = 0; this.vx *= -0.8; }
                if (this.x > width) { this.x = width; this.vx *= -0.8; }
                if (this.y < 0) { this.y = 0; this.vy *= -0.8; }
                if (this.y > height) { this.y = height; this.vy *= -0.8; }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function setup() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < config.count; i++) {
                particles.push(new Particle());
            }
        }

        function updateGrid() {
            const cols = Math.ceil(width / gridSize);
            const rows = Math.ceil(height / gridSize);
            grid = Array.from({ length: cols * rows }, () => []);
            
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const col = Math.floor(p.x / gridSize);
                const row = Math.floor(p.y / gridSize);
                if (col >= 0 && col < cols && row >= 0 && row < rows) {
                    grid[row * cols + col].push(p);
                }
            }
        }

        function drawLines() {
            const cols = Math.ceil(width / gridSize);
            ctx.strokeStyle = themes[config.theme].line;
            ctx.lineWidth = 0.5;

            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];
                const col = Math.floor(p1.x / gridSize);
                const row = Math.floor(p1.y / gridSize);

                // Check neighboring cells
                for (let r = -1; r <= 1; r++) {
                    for (let c = -1; c <= 1; c++) {
                        const targetCell = (row + r) * cols + (col + c);
                        if (grid[targetCell]) {
                            for (let j = 0; j < grid[targetCell].length; j++) {
                                const p2 = grid[targetCell][j];
                                if (p1 === p2) continue;
                                
                                const dx = p1.x - p2.x;
                                const dy = p1.y - p2.y;
                                const distSq = dx * dx + dy * dy;
                                
                                if (distSq < config.constellationDist * config.constellationDist) {
                                    ctx.beginPath();
                                    ctx.moveTo(p1.x, p1.y);
                                    ctx.lineTo(p2.x, p2.y);
                                    ctx.stroke();
                                }
                            }
                        }
                    }
                }
            }
        }

        let lastTime = 0;
        function loop(timestamp) {
            // FPS Counter
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            if (dt > 0) fpsCounter.innerText = `${Math.round(1000 / dt)} FPS`;

            // Motion Blur trailing
            ctx.fillStyle = `rgba(${parseInt(themes[config.theme].bg.slice(1,3), 16)}, ${parseInt(themes[config.theme].bg.slice(3,5), 16)}, ${parseInt(themes[config.theme].bg.slice(5,7), 16)}, 0.15)`;
            ctx.fillRect(0, 0, width, height);

            updateGrid();
            drawLines();

            for (let p of particles) {
                p.update();
                p.draw();
            }

            requestAnimationFrame(loop);
        }

        // UI Listeners
        document.getElementById('particleCount').addEventListener('input', (e) => {
            config.count = parseInt(e.target.value);
            document.getElementById('countVal').innerText = config.count;
            setup();
        });

        document.getElementById('gravity').addEventListener('input', (e) => {
            config.gravity = parseFloat(e.target.value);
            document.getElementById('gravityVal').innerText = config.gravity;
            config.mouseForce = config.gravity * 0.1;
        });

        document.getElementById('friction').addEventListener('input', (e) => {
            config.friction = parseFloat(e.target.value);
            document.getElementById('frictionVal').innerText = config.friction;
        });

        window.setTheme = (t) => {
            config.theme = t;
            setup();
        };

        document.getElementById('resetBtn').addEventListener('click', setup);

        document.getElementById('snapshotBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `neural-nexus-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Mouse Events
        window.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('dblclick', () => {
            mouse.dispersing = true;
            setTimeout(() => mouse.dispersing = false, 500);
        });

        window.addEventListener('resize', setup);

        // Init
        setup();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
